<!DOCTYPE html>

<style>
@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@keyframes fadeUp {
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes drift{
    from{
        transform:translate(0,0);
    }
    to {
        transform:translate(250px, 250px);
    }
}

body{
    font-family: Garamond, serif;
    margin: 0;
    color: #333;
    overflow-x: hidden;
    animation: fadeIn 1s ease-out;
    background: 	#EAF5F8;
    background: linear-gradient(90deg, rgba(234, 245, 248, 1) 0%, rgba(242, 249, 251, 1) 50%, rgba(234, 245, 248, 1) 100%);
}

body::before{
    content:"";
    position:fixed;
    inset:-50%;
    z-index: -1;
    background:repeating-linear-gradient(
        45deg,
        rgba(142, 142, 142, 0.1) 0px,
        rgba(142, 142, 142, 0.1) 2px,
        transparent 2px,
        transparent 80px
    );
    animation:drift 25s linear infinite;
}

header{
background:linear-gradient(to right,#222f5b,#0e1a40);
color:white;
text-align:left;
padding:15px 20px;
display:flex;
align-items:center;
gap:50px;
}

header h1{
margin: 0;
font-size: 40px;
flex:0.48;
display:flex;
align-items:center;
gap:12px;
}

.header-crown{
    width:58px;
    height:auto;
}

header h2, header h3, header h4, header h5{
margin:0;
font-size: 25px;
}

.main{
    position:relative;
    isolation:isolate;
    text-align:center;
    padding:250px 20px;
    text-decoration-color:#0e1a40;
    text-shadow: 2px 2px 6px rgba(255,255,255,0.8); 
    z-index: 1;
    animation: fadeUp 1s ease-out;
}

.main::before{
    content:"";
    position:absolute;
    inset:0;
    background:url("Images/snorlax.png") center / min(420px, 75vw) no-repeat;
    opacity:0.28;
    z-index:-1;
    pointer-events:none;
}

.main h1{
    font-size:48px;
    margin-bottom:20px;
    text-decoration-color:#0e1a40;
    text-shadow: 2px 2px 6px rgba(255,255,255,0.8); 
    z-index: 1;
    animation: fadeUp 1s ease-out;
}


.main p{
    font-size:22px;
    margin-top:0;
    margin-bottom:40px;
    animation: fadeUp 1s ease-out;
}

.main p:first-of-type{
    margin-bottom:3px;
}

.button{
    font-family:Garamond ,serif;
    background-color:#222f5b;
    color:white;
    text-decoration:none;
    padding:15px 30px;
    border-radius:10px;
    font-size:20px;
    z-index: 1;
    animation: fadeUp 1s ease-out;
}

.button:hover{
    background-color:#4F81BD;
}

</style>
