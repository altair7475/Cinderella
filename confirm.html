<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Confirm Order | Cinderella</title>
		<link rel="icon" type="image/png" href="Images/CLIPARTcrown.png">
		<link rel="stylesheet" href="css/cinderella.css">
	</head>
	<body>
		<header>
			<h1>Cinderella <img class="header-crown" src="Images/CLIPARTcrown.png" alt="Crown">
			</h1>
			<h2>
				<a href="index.html">Home</a>
			</h2>
			<h3>
				<a href="Products.html">Products</a>
			</h3>
			<h4>
				<a href="ContactUs.html">Contact Us</a>
			</h4>
			<h5>
				<a href="AboutUs.html">About Us</a>
			</h5>
		</header>
		<section class="page-hero">
			<h1>Confirm Your Order</h1>
			<p>Enter your payment details to complete your purchase securely.</p>
		</section>
		<main class="page-content">
			<form class="surface form-card" action="thankyou.html" method="get">
				<h2 class="section-title">Payment Details</h2>
				<div class="form-grid">
					<div class="field full">
						<label for="cardname">Cardholder Name</label>
						<input type="text" id="cardname" name="cardname" placeholder="John Smith" autocomplete="cc-name" required>
					</div>
					<div class="field full">
						<label for="cardnumber">Card Number</label>
						<input type="tel" id="cardnumber" name="cardnumber" placeholder="1234 5678 9012 3456" maxlength="23" inputmode="numeric" autocomplete="cc-number" pattern="[0-9 ]{13,23}" title="Enter a card number using 13 to 19 digits." required>
					</div>
					<div class="field">
						<label for="expiry">Expiry Date</label>
						<input type="tel" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5" inputmode="numeric" autocomplete="cc-exp" pattern="(0[1-9]|1[0-2])/[0-9]{2}" title="Enter the expiry date as MM/YY." required>
					</div>
					<div class="field">
						<label for="cvc">CVC</label>
						<input type="password" id="cvc" name="cvc" placeholder="123" maxlength="4" inputmode="numeric" autocomplete="cc-csc" pattern="[0-9]{3,4}" title="Enter the three- or four-digit CVC." required>
					</div>
				</div>
				<div class="form-actions">
					<input type="submit" value="Confirm Payment">
				</div>
				<a class="back-link" href="Order.html">&larr; Back to Order Page</a>
			</form>
		</main>
		<script>
			const cardNumber = document.getElementById('cardnumber');
			const expiry = document.getElementById('expiry');
			cardNumber.addEventListener('input', function() {
				const digits = this.value.replace(/\D/g, '').slice(0, 19);
				this.value = digits.replace(/(.{4})/g, '$1 ').trim();
			});
			expiry.addEventListener('input', function() {
				const digits = this.value.replace(/\D/g, '').slice(0, 4);
				this.value = digits.length > 2 ? digits.slice(0, 2) + '/' + digits.slice(2) : digits;
			});
		</script>
	</body>
</html>
