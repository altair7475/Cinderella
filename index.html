<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="icon" type="image/png" href="Images/CLIPARTcrown.png">
</head>

<style>
@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@keyframes fadeUp {
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes drift{
    from{
        transform:translate(0,0);
    }
    to {
        transform:translate(250px, 250px);
    }
}

/* Added */
*{
    box-sizing:border-box;
}

body{
    font-family: Garamond, serif;
    margin: 0;
    color: #333;
    overflow-x: hidden;
    animation: fadeIn 1s ease-out;
    background: radial-gradient(circle at top, #e9f1f2 0%, #e1eced 35%, #dae7e9 100%);
}

body::before{
    content:"";
    position:fixed;
    inset:-50%;
    z-index: -1;
    background:repeating-linear-gradient(
        45deg,
        rgba(142, 142, 142, 0.1) 0px,
        rgba(142, 142, 142, 0.1) 2px,
        transparent 2px,
        transparent 80px
    );
    animation:drift 25s linear infinite;
}

header{
    background:linear-gradient(to right,#222f5b,#0e1a40);
    color:white;
    text-align:left;
    padding:15px 20px;
    display:flex;
    align-items:center;
    gap:50px;
}

header h1{
    margin:0;
    font-size:40px;
    flex:0.48;
    display:flex;
    align-items:center;
    gap:12px;
}

.header-crown{
    width:58px;
    height:auto;
}

header h2,
header h3,
header h4,
header h5{
    margin:0;
    font-size:25px;
}

.main{
    position:relative;
    isolation:isolate;
    text-align:center;
    padding:250px 20px;
    text-decoration-color:#0e1a40;
    text-shadow:2px 2px 6px rgba(255,255,255,0.8);
    z-index:1;
    animation:fadeUp 1s ease-out;
}

.main::before{
    content:"";
    position:absolute;
    inset:0;
    background:url("Images/snorlax.png") center / min(420px,75vw) no-repeat;
    opacity:0.28;
    z-index:-1;
    pointer-events:none;
}

.main h1{
    font-size:48px;
    margin-bottom:20px;
    text-shadow:2px 2px 6px rgba(255,255,255,0.8);
    animation:fadeUp 1s ease-out;
}

.main p{
    font-size:22px;
    margin-top:0;
    margin-bottom:40px;
    animation:fadeUp 1s ease-out;
}

.main p:first-of-type{
    margin-bottom:3px;
}

.button{
    font-family:Garamond,serif;
    background-color:#222f5b;
    color:white;
    text-decoration:none;
    padding:15px 30px;
    border-radius:10px;
    font-size:20px;
    animation:fadeUp 1s ease-out;
}

.button:hover{
    background-color:#4F81BD;
}

/* ================= TABLETS ================= */

@media (max-width:768px){

    header{
        flex-wrap:wrap;
        justify-content:center;
        gap:20px;
        text-align:center;
    }

    header h1{
        flex:100%;
        justify-content:center;
        font-size:34px;
    }

    .header-crown{
        width:48px;
    }

    header h2,
    header h3,
    header h4,
    header h5{
        font-size:20px;
    }

    .main{
        padding:120px 20px;
    }

    .main::before{
        background-size:min(300px,80vw);
    }

    .main h1{
        font-size:36px;
    }

    .main p{
        font-size:18px;
    }

    .button{
        font-size:18px;
        padding:14px 28px;
    }
}

/* ================= PHONES ================= */

@media (max-width:480px){

    header{
        flex-direction:column;
        align-items:center;
        gap:15px;
    }

    header h1{
        flex:unset;
        font-size:28px;
    }

    .header-crown{
        width:40px;
    }

    header h2,
    header h3,
    header h4,
    header h5{
        width:100%;
        text-align:center;
        font-size:18px;
    }

    .main{
        padding:80px 15px;
    }

    .main::before{
        background-size:220px;
        opacity:0.22;
    }

    .main h1{
        font-size:28px;
    }

    .main p{
        font-size:16px;
        line-height:1.6;
    }

    .button{
        display:inline-block;
        width:80%;
        max-width:250px;
        text-align:center;
    }
}

</style>

<body>

<header>
    <h1>Cinderella <img class="header-crown" src="Images/CLIPARTcrown.png" alt="Crown"></h1>
    <h2><a href="Products.html" style="color:aliceblue;text-decoration:none;">Products</a></h2>
    <h3><a href="Order.html" style="color:aliceblue;text-decoration:none;">Order</a></h3>
    <h4><a href="ContactUs.html" style="color:aliceblue;text-decoration:none;">Contact Us</a></h4>
    <h5><a href="AboutUs.html" style="color:aliceblue;text-decoration:none;">About Us</a></h5>
</header>

<section class="main">
    <h1>Welcome to Cinderella</h1>
    <p>Your home for soft, cuddly and adorable plushies.</p>
    <p>Discover soft, high-quality companions made to bring comfort and joy.</p>
    <a href="Products.html" class="button">Browse</a>
</section>

</body>
</html>
