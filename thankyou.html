<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <link rel="icon" type="crown" href="CLIPARTcrown.png">
</head>
<style>
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes drift {
    from { transform: translate(0, 0); }
    to { transform: translate(250px, 250px); }
}

body {
    font-family: Garamond, serif;
    margin: 0;
    color: #333;
    overflow-x: hidden;
    animation: fadeIn 1s ease-out;
}

body::before {
    content: "";
    position: fixed;
    inset: -50%;
    z-index: -1;
}

header {
    background: linear-gradient(to right, #222f5b, #0e1a40);
    color: white;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 50px;
    flex-wrap: wrap;
}

header h1 {
    margin: 0;
    font-size: 40px;
    flex: 0.48;
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-crown {
    width: 58px;
    height: auto;
}

header h2, header h3, header h4, header h5 {
    margin: 0;
    font-size: 25px;
}

.thank-you {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
}

.thank-you h1 {
    font-size: 48px;
    margin-bottom: 12px;
    color: #222f5b;
}

.thank-you p {
    font-size: 22px;
    margin: 0 0 30px;
}

.button {
    font-family: Garamond, serif;
    background-color: #222f5b;
    color: white;
    text-decoration: none;
    padding: 15px 30px;
    border-radius: 10px;
    font-size: 20px;
}

.button:hover { background-color: #4F81BD; }
</style>
<body>
    <header>
        <h1>Cinderella <img class="header-crown" src="CLIPARTcrown.png" alt="Crown"></h1>
        <h2><a href="index.html" style="color: aliceblue; text-decoration: none;">Home</a></h2>
        <h3><a href="Products.html" style="color: aliceblue; text-decoration: none;">Products</a></h3>
        <h4><a href="Order.html" style="color: aliceblue; text-decoration: none;">Order</a></h4>
        <h5><a href="ContactUs.html" style="color: aliceblue; text-decoration: none;">Contact Us</a></h5>
    </header>
    <main class="thank-you">
        <h1>Thank you for your order!</h1>
        <p>We have received your order and will process it shortly.</p>
        <a class="button" href="index.html">Return to Home</a>
    </main>
</body>
</html>
