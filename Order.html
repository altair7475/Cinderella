<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order</title>
<link rel="icon" type="image/png" href="Images/CLIPARTcrown.png">

<style>

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

*{
    box-sizing:border-box;
}

body{
    font-family:Garamond, serif;
    margin:0;
    background:#F5FAFD;
    color:#333;
    animation:fadeIn 1s ease-out;
}

header{
    background:linear-gradient(to right,#222f5b,#0e1a40);
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    gap:50px;
    flex-wrap:wrap;
}

header h1{
    margin:0;
    font-size:40px;
    flex:0.48;
    display:flex;
    align-items:center;
    gap:12px;
}

.header-crown{
    width:58px;
    height:auto;
}

header h2,
header h3,
header h4,
header h5{
    margin:0;
    font-size:25px;
}

header a{
    color:aliceblue;
    text-decoration:none;
}

header a:hover{
    color:#d9e8ff;
}

.container{
    max-width:900px;
    margin:60px auto;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
    animation:fadeUp 1s ease-out;
}

.container h1{
    text-align:center;
    color:#222f5b;
    margin-top:0;
}

label{
    display:block;
    font-size:20px;
    font-weight:bold;
    margin-top:18px;
}

input[type=text],
input[type=email],
input[type=tel],
input[type=number],
select,
textarea{
    width:100%;
    padding:12px;
    margin-top:6px;
    font-size:18px;
    font-family:Garamond, serif;
    border:1px solid #bbb;
    border-radius:8px;
}

textarea{
    resize:vertical;
}

.radio-group,
.checkbox-group{
    margin-top:8px;
}

.radio-group label,
.checkbox-group label{
    display:inline;
    font-weight:normal;
    margin-right:20px;
    font-size:18px;
}

.button-group{
    margin-top:30px;
}

input[type=submit],
input[type=reset]{
    background:#222f5b;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:10px;
    font-size:20px;
    cursor:pointer;
    transition:.3s;
    margin-right:10px;
}

input[type=submit]:hover,
input[type=reset]:hover{
    background:#4F81BD;
}

@media (max-width:768px){

    header{
        justify-content:center;
        gap:20px;
        text-align:center;
    }

    header h1{
        flex:100%;
        justify-content:center;
        font-size:34px;
    }

    .header-crown{
        width:48px;
    }

    header h2,
    header h3,
    header h4,
    header h5{
        font-size:20px;
    }

    .container{
        margin:30px 20px;
        padding:30px;
    }

    label{
        font-size:18px;
    }

    input,
    select,
    textarea{
        font-size:17px;
    }
}

@media (max-width:480px){

    header{
        flex-direction:column;
        align-items:center;
        gap:15px;
    }

    header h1{
        flex:unset;
        font-size:28px;
    }

    .header-crown{
        width:40px;
    }

    header h2,
    header h3,
    header h4,
    header h5{
        width:100%;
        text-align:center;
        font-size:18px;
    }

    .container{
        margin:20px 15px;
        padding:20px;
    }

    label{
        font-size:16px;
    }

    input,
    select,
    textarea{
        font-size:16px;
    }

    input[type=submit],
    input[type=reset]{
        width:100%;
        margin:8px 0;
    }
}

</style>
</head>

<body>

<header>
    <h1>Cinderella <img class="header-crown" src="Images/CLIPARTcrown.png" alt="Crown"></h1>

    <h2><a href="index.html">Home</a></h2>
    <h3><a href="Products.html">Products</a></h3>
    <h4><a href="ContactUs.html">Contact Us</a></h4>
    <h5><a href="AboutUs.html">About Us</a></h5>
</header>

<div class="container">

<h1>Place Your Order</h1>

<form action="confirm.html" method="get">

<label for="name">Full Name:</label>
<input type="text" id="name" name="name" placeholder="Your Name" required>

<label for="email">Email:</label>
<input type="email" id="email" name="email" placeholder="abc@xyz.com" required>

<label for="phone">Phone Number:</label>
<input type="tel" id="phone" name="phone" placeholder="12345678" required>

<label for="plushie">Choose a Plushie:</label>

<select id="plushie" name="plushie">
    <option>Snorlax</option>
    <option>Sharko</option>
    <option>Mimikyu</option>
    <option>Ariiq Body Pillow</option>
    <option>Pigeon</option>
    <option>Red Panda</option>
    <option>Black Cat</option>
</select>

<label for="quantity">Quantity:</label>

<input type="number" id="quantity" name="quantity" min="1" max="10" required>

<label>Delivery Method:</label>

<div class="radio-group">
<input type="radio" id="delivery" name="delivery" value="Delivery" required>
<label for="delivery">Home Delivery</label>

<input type="radio" id="pickup" name="delivery" value="Pickup">
<label for="pickup">Self Collection</label>
</div>

<label>Payment Method:</label>

<div class="radio-group">
<input type="radio" id="card" name="payment" value="Card" required>
<label for="card">Credit/Debit Card</label>

<input type="radio" id="cash" name="payment" value="Cash">
<label for="cash">Cash on Delivery</label>
</div>

<label for="address">Delivery Address:</label>

<textarea
    id="address"
    name="address"
    rows="4"
    placeholder="Your Address"
    required></textarea>

<label for="remarks">Special Requests:</label>

<textarea
    id="remarks"
    name="remarks"
    rows="4"
    placeholder="Gift wrapping, message, etc."></textarea>

<div class="checkbox-group">

<input
    type="checkbox"
    id="agree"
    name="agree"
    required>

<label for="agree">
I agree to the terms and conditions.
</label>

</div>

<div class="button-group">

<input
    type="submit"
    value="Place Order">

<input
    type="reset"
    value="Clear Form">

</div>

</form>

</div>

</body>
</html>
