<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Order | Cinderella</title>
		<link rel="icon" type="image/png" href="Images/CLIPARTcrown.png">
		<link rel="stylesheet" href="css/cinderella.css">
	</head>
	<body>
		<header>
			<h1>Cinderella <img class="header-crown" src="Images/CLIPARTcrown.png" alt="Crown">
			</h1>
			<h2>
				<a href="index.html">Home</a>
			</h2>
			<h3>
				<a href="Products.html">Products</a>
			</h3>
			<h4>
				<a href="ContactUs.html">Contact Us</a>
			</h4>
			<h5>
				<a href="AboutUs.html">About Us</a>
			</h5>
		</header>
		<section class="page-hero">
			<h1>Place Your Order</h1>
			<p>Choose your favourite plushie and we'll take care of the rest.</p>
		</section>
		<main class="page-content">
			<form id="order-form" class="surface form-card" action="confirm.html" method="get">
				<h2 class="section-title">Order Details</h2>
				<div class="form-grid">
					<div class="field">
						<label for="name">Full Name</label>
						<input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>
					</div>
					<div class="field">
						<label for="email">Email Address</label>
						<input type="email" id="email" name="email" placeholder="abc@xyz.com" autocomplete="email" required>
					</div>
					<div class="field">
						<label for="phone">Phone Number</label>
						<input type="tel" id="phone" name="phone" placeholder="12345678" autocomplete="tel" required>
					</div>
					<div class="field">
						<label for="plushie">Choose a Plushie</label>
						<select id="plushie" name="plushie" required>
							<option value="Snorlax">Snorlax</option>
							<option value="Sharko">Sharko</option>
							<option value="Mimikyu">Mimikyu</option>
							<option value="Ariiq Body Pillow">Ariiq Body Pillow</option>
							<option value="Pigeon">Pigeon</option>
							<option value="Red Panda">Red Panda</option>
							<option value="Black Cat">Black Cat</option>
						</select>
					</div>
					<div class="field">
						<label for="quantity">Quantity</label>
						<input type="number" id="quantity" name="quantity" min="1" max="10" value="1" required>
					</div>
					<div class="field">
						<label>Delivery Method</label>
						<div class="choice-row">
							<label>
								<input type="radio" name="delivery" value="Delivery" required> Home delivery </label>
							<label>
								<input type="radio" name="delivery" value="Pickup"> Self collection </label>
						</div>
					</div>
					<div class="field full">
						<label>Payment Method</label>
						<div class="choice-row">
							<label>
								<input type="radio" id="card" name="payment" value="Card" required> Credit or debit card </label>
							<label>
								<input type="radio" id="cash" name="payment" value="Cash"> Cash on delivery </label>
						</div>
					</div>
					<div class="field full">
						<label for="address">Delivery Address</label>
						<textarea id="address" name="address" placeholder="Your address" required></textarea>
					</div>
					<div class="field full">
						<label for="remarks">Special Requests <small>(optional)</small>
						</label>
						<textarea id="remarks" name="remarks" placeholder="Gift wrapping, message, and so on"></textarea>
					</div>
					<div class="field full">
						<div class="choice-row">
							<label>
								<input type="checkbox" id="agree" name="agree" required> I agree to the terms and conditions. </label>
						</div>
					</div>
				</div>
				<div class="form-actions">
					<input type="submit" value="Continue to Payment">
					<input type="reset" value="Clear Form">
				</div>
			</form>
		</main>
		<script>
			document.getElementById('order-form').addEventListener('submit', function() {
				this.action = document.getElementById('cash').checked ? 'thankyou.html' : 'confirm.html';
			});
		</script>
	</body>
</html>
